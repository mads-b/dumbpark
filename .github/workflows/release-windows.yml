name: Release Windows installer

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
      - run: npm run dist:win
      - name: Publish installer on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item -LiteralPath 'dist/DumbPark-Setup.exe'
          gh release create $env:GITHUB_REF_NAME $installer.FullName --verify-tag --title "DumbPark $env:GITHUB_REF_NAME" --generate-notes
