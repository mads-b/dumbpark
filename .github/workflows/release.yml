name: Release Windows and Android apps

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/DumbPark-Setup.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - run: npm ci
      - run: npm test
      - run: npm run build:android-assets
      - run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DumbPark-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: DumbPark-Android-debug.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true
      - name: Publish both apps on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/DumbPark-Setup.exe artifacts/DumbPark-Android-debug.apk --verify-tag --title "DumbPark $TAG" --generate-notes
